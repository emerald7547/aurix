name: Fix Aurix brief submission
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect form to persistent API
        shell: python
        run: |
          from pathlib import Path
          p=Path('create.html')
          s=p.read_text(encoding='utf-8')
          marker='aurix-persistent-submit-v2'
          if marker not in s:
              script=r'''<script id="aurix-persistent-submit-v2">
(function(){
 const form=document.getElementById('briefForm'); if(!form)return;
 form.addEventListener('submit',async function(e){
   e.preventDefault(); e.stopImmediatePropagation();
   const fd=new FormData(form), contact=String(fd.get('contact')||'').trim();
   const email=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)?contact:'';
   const phone=email?'':contact;
   const features=[...form.querySelectorAll('input[name="pages"]:checked')].map(x=>x.value);
   const styles=[...form.querySelectorAll('input[name="font"]:checked')].map(x=>x.value);
   const payload={name:String(fd.get('name')||''),email,phone,businessName:String(fd.get('project')||''),businessDescription:String(fd.get('description')||''),goal:String(form.querySelector('input[name="website-type"]:checked')?.value||''),style:styles.join(', '),colors:[fd.get('primary'),fd.get('secondary'),fd.get('accent')].filter(Boolean).join(', '),hasContent:String(fd.get('content')||''),additionalInfo:String(fd.get('additional')||''),timeline:String(fd.get('timeline')||''),features};
   const btn=form.querySelector('.submit-button'); if(btn){btn.disabled=true;btn.textContent='Saving…';}
   try{const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); if(!r.ok)throw new Error(await r.text());
     const success=document.querySelector('.success'); if(success)success.classList.add('is-visible'); form.style.display='none'; window.scrollTo({top:0,behavior:'smooth'});
   }catch(err){console.error(err);alert('Could not save your brief. Please try again.');if(btn){btn.disabled=false;btn.textContent='Submit brief';}}
 },true);
})();
</script>'''
              s=s.replace('</body>',script+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add create.html
          git diff --cached --quiet || git commit -m "Fix persistent project brief submission"
          git push
