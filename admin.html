<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AURIX | Admin Dashboard</title>
<style>
:root{--bg:#07080c;--card:#11131a;--card2:#171a22;--line:#292d38;--text:#f5f6fa;--muted:#9299aa;--accent:#b7ff4a;--danger:#ff6677;--violet:#7445ff;--blue:#5d91ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(160% 100% at 50% 0%,#1a1e2e 0%,#0d0f14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}header{padding:1.5rem 2rem;border-bottom:1px solid var(--line);background:rgba(17,19,26,.8)}.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{margin:0;font-size:2rem}.logout-btn,.filter-btn,.btn-small{padding:.6rem 1.2rem;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}.stat-card,.submission-card{padding:1.5rem;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:12px}.stat-label,.info-label,.card-date{color:var(--muted);font-size:.85rem}.stat-value{font-size:2rem;font-weight:700;color:var(--accent)}.container{max-width:1400px;margin:auto;padding:2rem}.filters{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}.filter-btn.active{background:var(--violet);border-color:var(--violet);color:white}.submissions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:1.5rem}.submission-card:hover{border-color:var(--violet)}.card-header{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}.card-title{font-size:1.2rem;font-weight:700;color:var(--accent)}.card-subtitle{color:var(--muted);font-size:.9rem}.card-date{margin-top:.5rem}.card-body{display:flex;flex-direction:column;gap:.8rem}.info-row{display:flex;gap:1rem}.info-label{min-width:110px}.info-value{color:var(--text);word-break:break-word;flex:1}.info-value a{color:var(--blue);text-decoration:none}.features-list{display:flex;flex-wrap:wrap;gap:.5rem}.feature-tag{padding:.3rem .7rem;background:rgba(116,69,255,.2);border:1px solid var(--violet);border-radius:4px;font-size:.75rem;color:var(--accent)}.card-actions{display:flex;gap:.5rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}.btn-small{flex:1}.btn-view{border-color:var(--blue);color:var(--blue)}.btn-delete{border-color:var(--danger);color:var(--danger)}.empty-state,.loading{text-align:center;padding:4rem 2rem;color:var(--muted)}.empty-state h2{color:var(--text)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;padding:2rem}.modal.open{display:flex;align-items:center;justify-content:center}.modal-box{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:700px;max-height:85vh;overflow-y:auto;padding:2rem}.modal-close{float:right;background:none;border:0;color:var(--text);font-size:1.5rem;cursor:pointer}.modal-title{clear:both;margin:0 0 1.5rem}.modal-content{display:flex;flex-direction:column;gap:1rem}.detail-section{background:var(--card2);padding:1rem;border-radius:8px}.detail-section h3{margin:0 0 1rem;color:var(--accent)}.detail-row{padding:.45rem 0;border-bottom:1px solid var(--line);line-height:1.5}.detail-row:last-child{border-bottom:0}.detail-label{color:var(--muted);font-weight:600}.detail-value{white-space:pre-wrap;word-break:break-word}.loading{padding:2rem}@media(max-width:768px){.submissions-grid{grid-template-columns:1fr}.header-top{flex-direction:column;align-items:flex-start;gap:1rem}.info-row{flex-direction:column;gap:.2rem}}
</style></head>
<body>
<header><div class="header-top"><div><div class="eyebrow">AURIX / Dashboard</div><h1>Client Submissions</h1></div><button class="logout-btn" onclick="logout()">Log out</button></div><div class="stats"><div class="stat-card"><div class="stat-label">Total Submissions</div><div class="stat-value" id="totalCount">0</div></div><div class="stat-card"><div class="stat-label">Complete Briefs</div><div class="stat-value" id="completeCount">0</div></div><div class="stat-card"><div class="stat-label">Incomplete</div><div class="stat-value" id="incompleteCount">0</div></div></div></header>
<div class="container"><div class="filters"><button class="filter-btn active" onclick="filterSubmissions('all',this)">All Submissions</button><button class="filter-btn" onclick="filterSubmissions('complete',this)">Complete</button><button class="filter-btn" onclick="filterSubmissions('incomplete',this)">Incomplete</button></div><div id="loading" class="loading">Loading submissions...</div><div id="empty" class="empty-state" style="display:none"><h2>No submissions yet</h2><p>When clients submit their briefs, they'll appear here.</p></div><div id="submissionsList" class="submissions-grid"></div></div>
<div id="modal" class="modal"><div class="modal-box"><button class="modal-close" onclick="closeModal()">×</button><h2 class="modal-title">Complete Submission Details</h2><div id="modalContent" class="modal-content"></div></div></div>
<script>
let submissions=[],currentFilter='all';
const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};
function isComplete(s){return !!(s.name&&s.businessName&&(s.email||s.phone)&&s.goal)}
async function loadSubmissions(){try{const r=await fetch('/api/get',{cache:'no-store'});if(!r.ok)throw Error('Failed to load');submissions=await r.json();renderSubmissions()}catch(e){console.error(e);document.getElementById('loading').innerHTML='<p style="color:var(--danger)">Error loading submissions. Please refresh.</p>'}}
function renderSubmissions(){const complete=submissions.filter(isComplete).length;document.getElementById('totalCount').textContent=submissions.length;document.getElementById('completeCount').textContent=complete;document.getElementById('incompleteCount').textContent=submissions.length-complete;let filtered=currentFilter==='complete'?submissions.filter(isComplete):currentFilter==='incomplete'?submissions.filter(s=>!isComplete(s)):submissions;document.getElementById('loading').style.display='none';document.getElementById('empty').style.display=filtered.length?'none':'block';document.getElementById('submissionsList').innerHTML=filtered.map(s=>`<div class="submission-card"><div class="card-header"><div class="card-title">${esc(s.businessName||'Untitled')}</div><div class="card-subtitle">${esc(s.name||'Unknown')}</div><div class="card-date">${s.submittedAt?new Date(s.submittedAt).toLocaleString():'Date unavailable'}</div></div><div class="card-body"><div class="info-row"><span class="info-label">Email</span><span class="info-value">${s.email?`<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:'Not provided'}</span></div><div class="info-row"><span class="info-label">Phone</span><span class="info-value">${esc(s.phone||'Not provided')}</span></div><div class="info-row"><span class="info-label">Goal</span><span class="info-value">${esc(s.goal||'Not provided')}</span></div>${s.style?`<div class="info-row"><span class="info-label">Style</span><span class="info-value">${esc(s.style)}</span></div>`:''}${s.timeline?`<div class="info-row"><span class="info-label">Timeline</span><span class="info-value">${esc(s.timeline)}</span></div>`:''}${s.features?.length?`<div class="info-row"><span class="info-label">Pages</span><div class="features-list">${s.features.map(f=>`<span class="feature-tag">${esc(f)}</span>`).join('')}</div></div>`:''}</div><div class="card-actions"><button class="btn-small btn-view" onclick="viewDetails('${esc(s.id)}')">View Full Details</button></div></div>`).join('')}
function viewDetails(id){const s=submissions.find(x=>String(x.id)===String(id));if(!s)return;const row=(label,value)=>`<div class="detail-row"><span class="detail-label">${label}:</span><div class="detail-value">${value?esc(value):'Not provided'}</div></div>`;document.getElementById('modalContent').innerHTML=`<div class="detail-section"><h3>Contact & Business</h3>${row('Name',s.name)}${row('Email',s.email)}${row('Phone',s.phone)}${row('Instagram',s.instagram)}${row('Business Name',s.businessName)}${row('Business Description',s.businessDescription)}</div><div class="detail-section"><h3>Project Brief</h3>${row('Website Goal',s.goal)}${row('Style Preference',s.style)}${row('Color Scheme',s.colors)}${row('Has Content',s.hasContent)}${row('Timeline',s.timeline)}${row('Pages / Features',s.features?.length?s.features.join(', '):'Not specified')}${row('Additional Information',s.additionalInfo)}</div><div class="detail-section"><h3>Submission</h3>${row('Submission ID',s.id)}${row('Submitted At',s.submittedAt?s.submittedAt.toLocaleString?.()||new Date(s.submittedAt).toLocaleString():'Not available')}</div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function filterSubmissions(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderSubmissions()}
function logout(){if(confirm('Log out?')){sessionStorage.removeItem('aurixAdmin');location.reload()}}
loadSubmissions();setInterval(loadSubmissions,30000);
</script></body></html>
