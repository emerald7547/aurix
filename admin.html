<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX Admin</title><style>
:root{--bg:#07080c;--card:#11131a;--card2:#171a22;--line:#292d38;--text:#f5f6fa;--muted:#9299aa;--accent:#b7ff4a;--danger:#ff6677}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#242a38 0,transparent 32%),var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.loginBox{width:min(440px,100%);padding:38px;background:rgba(17,19,26,.92);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 90px #0008}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.login h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}.loginRow{display:flex;gap:9px;margin-top:24px}.loginRow input{flex:1}.input{width:100%;padding:13px 14px;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:12px;outline:0}.input:focus{border-color:var(--accent)}button{cursor:pointer}.primary,.logout{border-radius:12px;padding:13px 17px;font-weight:800}.primary{border:0;background:var(--accent);color:#080a08}.logout{background:transparent;color:var(--text);border:1px solid var(--line)}header{position:sticky;top:0;z-index:5;background:#07080ceb;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:24px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.top h1{margin:6px 0 0;font-size:30px}.stats{display:flex;gap:12px;padding:24px 0 8px}.stat{min-width:170px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:17px}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted)}#list{padding:8px 0 60px}.empty{padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}.client{margin:14px 0;background:linear-gradient(145deg,var(--card),#0d0f14);border:1px solid var(--line);border-radius:21px;overflow:hidden}.clientHead{display:flex;justify-content:space-between;gap:20px;padding:22px;background:var(--card2);border-bottom:1px solid var(--line)}.clientHead h2{margin:0 0 6px;font-size:21px}.badge{white-space:nowrap;height:max-content;color:var(--accent);border:1px solid #41532a;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.1em}.grid{display:grid;grid-template-columns:repeat(2,1fr)}.item{padding:17px 22px;border-bottom:1px solid var(--line)}.item:nth-child(odd){border-right:1px solid var(--line)}.full{grid-column:1/-1}.label{margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.value{line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.value a{color:var(--accent);text-decoration:none}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 9px;border:1px solid var(--line);border-radius:99px;background:#0a0c11;font-size:12px}.error{color:var(--danger)}@media(max-width:680px){.wrap{width:calc(100% - 20px)}.loginRow{flex-direction:column}.top h1{font-size:24px}.stats{overflow:auto}.grid{grid-template-columns:1fr}.item:nth-child(odd){border-right:0}.full{grid-column:auto}.clientHead{padding:17px}.item{padding:15px 17px}}
</style></head><body>
<div id="login" class="login"><div class="loginBox"><div class="eyebrow">AURIX / PRIVATE</div><h1>Admin access</h1><div class="muted">Client submissions are protected.</div><div class="loginRow"><input id="password" class="input" type="password" placeholder="Admin password" autocomplete="current-password"><button class="primary" id="loginBtn">Enter</button></div><p id="loginError" class="error"></p></div></div>
<div id="app" style="display:none"><header><div class="wrap top"><div><div class="eyebrow">AURIX / DASHBOARD</div><h1>Client submissions</h1></div><button class="logout" id="logout">Log out</button></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="count">0</b><span>Total submissions</span></div><div class="stat"><b id="latest">—</b><span>Latest</span></div></div><div id="list"><div class="empty">Loading submissions…</div></div></main></div>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){const password=$('password').value.trim();$('loginError').textContent='';if(!password)return;$('loginBtn').disabled=true;try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw new Error('Invalid password');sessionStorage.setItem('aurixAdmin','1');openApp()}catch(e){$('loginError').textContent=e.message}finally{$('loginBtn').disabled=false}}
function openApp(){$('login').style.display='none';$('app').style.display='block';load()};function logout(){sessionStorage.removeItem('aurixAdmin');location.reload()}
function item(label,value,cls='',link=''){let v=esc(value||'Not provided');if(link&&value)v='<a href="'+esc(link)+'">'+v+'</a>';return '<div class="item '+cls+'"><div class="label">'+label+'</div><div class="value">'+v+'</div></div>'}
async function load(){try{const r=await fetch('/api/get');if(!r.ok)throw new Error();const data=await r.json();$('count').textContent=data.length;$('latest').textContent=data[0]?.submittedAt?new Date(data[0].submittedAt).toLocaleDateString():'—';if(!data.length){$('list').innerHTML='<div class="empty">No submissions yet.</div>';return}$('list').innerHTML=data.map(s=>'<article class="client"><div class="clientHead"><div><h2>'+esc(s.businessName||'Untitled project')+'</h2><div class="muted">'+(s.submittedAt?new Date(s.submittedAt).toLocaleString():'Date unavailable')+'</div></div><span class="badge">CLIENT BRIEF</span></div><div class="grid">'+item('Name',s.name,'', '')+item('Email',s.email,'',s.email?'mailto:'+encodeURIComponent(s.email):'')+item('Phone',s.phone,'',s.phone?'tel:'+encodeURIComponent(s.phone):'')+item('Timeline',s.timeline)+item('Website goal',s.goal)+item('Style',s.style)+item('Colors',s.colors)+item('Content',s.hasContent)+item('Business description',s.businessDescription,'full')+item('Additional information',s.additionalInfo,'full')+'<div class="item full"><div class="label">Pages / features</div><div class="value"><div class="chips">'+((Array.isArray(s.features)&&s.features.length)?s.features.map(f=>'<span class="chip">'+esc(f)+'</span>').join(''):'Not provided')+'</div></div></div></div></article>').join('')}catch(e){$('list').innerHTML='<div class="empty error">Could not load submissions. Check the API/database deployment.</div>'}}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=logout;if(sessionStorage.getItem('aurixAdmin')==='1')openApp();
</script></body></html>
