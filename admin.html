<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX Admin</title><style>
:root{--bg:#07080c;--card:#11131a;--card2:#171a22;--line:#292d38;--text:#f5f6fa;--muted:#9299aa;--accent:#b7ff4a;--danger:#ff6677;--warn:#ffbf69}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#242a38 0,transparent 32%),var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.loginBox,.modalBox{width:min(480px,calc(100% - 24px));padding:38px;background:rgba(17,19,26,.96);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 90px #0008}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.login h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}.loginRow{display:flex;gap:9px;margin-top:24px}.loginRow input{flex:1}.input,.editGrid input,.editGrid textarea{width:100%;padding:12px 14px;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:12px;outline:0;font:inherit}.input:focus,.editGrid input:focus,.editGrid textarea:focus{border-color:var(--accent)}button{cursor:pointer}.primary,.logout,.action,.filter{border-radius:12px;padding:11px 15px;font-weight:800}.primary{border:0;background:var(--accent);color:#080a08}.logout,.action,.filter{background:transparent;color:var(--text);border:1px solid var(--line)}.action:hover,.filter:hover{border-color:var(--accent);color:var(--accent)}.danger:hover{border-color:var(--danger);color:var(--danger)}.filter.active{background:var(--accent);border-color:var(--accent);color:#080a08}header{position:sticky;top:0;z-index:5;background:#07080ceb;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:24px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.top h1{margin:6px 0 0;font-size:30px}.stats{display:flex;gap:12px;padding:24px 0 8px}.stat{min-width:170px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:17px}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0}.filter{font-size:12px;letter-spacing:.04em}.filter.complete.active{color:#080a08}.filter.incomplete.active{background:var(--warn);border-color:var(--warn);color:#080a08}#list{padding:8px 0 60px}.empty{padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}.client{margin:14px 0;background:linear-gradient(145deg,var(--card),#0d0f14);border:1px solid var(--line);border-radius:21px;overflow:hidden}.clientHead{display:flex;justify-content:space-between;gap:20px;padding:22px;background:var(--card2);border-bottom:1px solid var(--line)}.clientHead h2{margin:0 0 6px;font-size:21px}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{white-space:nowrap;height:max-content;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.1em}.complete{color:var(--accent);border:1px solid #41532a}.incomplete{color:var(--warn);border:1px solid #684a25}.grid{display:grid;grid-template-columns:repeat(2,1fr)}.item{padding:17px 22px;border-bottom:1px solid var(--line)}.item:nth-child(odd){border-right:1px solid var(--line)}.full{grid-column:1/-1}.label{margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.value{line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.value a{color:var(--accent);text-decoration:none}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 9px;border:1px solid var(--line);border-radius:99px;background:#0a0c11;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 22px;background:#0c0e13}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.photos img{width:100%;height:130px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.error{color:var(--danger)}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#000b;overflow:auto}.modal.open{display:grid}.modalBox{width:min(760px,100%);max-height:90vh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.modalHead h2{margin:0}.editGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.editGrid .full{grid-column:1/-1}.editGrid textarea{min-height:110px;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:680px){.wrap{width:calc(100% - 20px)}.loginRow{flex-direction:column}.top h1{font-size:24px}.stats{overflow:auto}.grid,.editGrid{grid-template-columns:1fr}.item:nth-child(odd){border-right:0}.full{grid-column:auto}.clientHead{padding:17px}.item{padding:15px 17px}.modalBox{padding:24px}}
</style></head><body>
<div id="login" class="login"><div class="loginBox"><div class="eyebrow">AURIX / PRIVATE</div><h1>Admin access</h1><div class="muted">Client submissions are protected.</div><div class="loginRow"><input id="password" class="input" type="password" placeholder="Admin password" autocomplete="current-password"><button class="primary" id="loginBtn">Enter</button></div><p id="loginError" class="error"></p></div></div>
<div id="app" style="display:none"><header><div class="wrap top"><div><div class="eyebrow">AURIX / DASHBOARD</div><h1>Client submissions</h1></div><button class="logout" id="logout">Log out</button></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="count">0</b><span>Total submissions</span></div><div class="stat"><b id="completeCount">0</b><span>Complete</span></div><div class="stat"><b id="incompleteCount">0</b><span>Incomplete</span></div><div class="stat"><b id="latest">—</b><span>Latest</span></div></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter complete" data-filter="complete">Completed</button><button class="filter incomplete" data-filter="incomplete">Incomplete</button><button class="filter" data-filter="new">Newest first</button></div><div id="list"><div class="empty">Loading submissions…</div></div></main></div>
<div id="modal" class="modal"><div class="modalBox"><div class="modalHead"><div><div class="eyebrow">EDIT SUBMISSION</div><h2>Update client details</h2></div><button class="action" onclick="closeModal()">Close</button></div><form id="editForm"><input type="hidden" id="e-id"><div class="editGrid"><div><label>Name</label><input id="e-name"></div><div><label>Business / Project</label><input id="e-business"></div><div><label>Email</label><input id="e-email"></div><div><label>Phone</label><input id="e-phone"></div><div><label>Website goal</label><input id="e-goal"></div><div><label>Style</label><input id="e-style"></div><div><label>Colors</label><input id="e-colors"></div><div><label>Timeline</label><input id="e-timeline"></div><div><label>Content</label><input id="e-content"></div><div class="full"><label>Business description</label><textarea id="e-description"></textarea></div><div class="full"><label>Additional information</label><textarea id="e-additional"></textarea></div><div class="full"><label>Features / Pages (comma separated)</label><input id="e-features"></div></div><div class="modalActions"><button type="button" class="action" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div><p id="editError" class="error"></p></form></div></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let submissions=[],activeFilter='all';
async function login(){const password=$('password').value.trim();$('loginError').textContent='';if(!password)return;$('loginBtn').disabled=true;try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw Error('Invalid password');sessionStorage.setItem('aurixAdmin','1');openApp()}catch(e){$('loginError').textContent=e.message}finally{$('loginBtn').disabled=false}}
function openApp(){$('login').style.display='none';$('app').style.display='block';load()}function logout(){sessionStorage.removeItem('aurixAdmin');location.reload()}
function complete(s){return !!(s.name&&s.businessName&&(s.email||s.phone)&&s.businessDescription&&s.goal&&s.style)}
function item(label,value,cls='',link=''){let v=esc(value||'Not provided');if(link&&value)v='<a href="'+esc(link)+'">'+v+'</a>';return '<div class="item '+cls+'"><div class="label">'+label+'</div><div class="value">'+v+'</div></div>'}
async function load(){try{const r=await fetch('/api/get');if(!r.ok)throw Error();submissions=await r.json();render()}catch(e){$('list').innerHTML='<div class="empty error">Could not load submissions. Check the API/database deployment.</div>'}}
function render(){const done=submissions.filter(complete).length;$('count').textContent=submissions.length;$('completeCount').textContent=done;$('incompleteCount').textContent=submissions.length-done;$('latest').textContent=submissions[0]?.submittedAt?new Date(submissions[0].submittedAt).toLocaleDateString():'—';let rows=[...submissions];if(activeFilter==='complete')rows=rows.filter(complete);if(activeFilter==='incomplete')rows=rows.filter(s=>!complete(s));if(activeFilter==='new')rows.sort((a,b)=>new Date(b.submittedAt||0)-new Date(a.submittedAt||0));if(!rows.length){$('list').innerHTML='<div class="empty">No submissions in this view.</div>';return}$('list').innerHTML=rows.map(s=>{const ok=complete(s),photos=Array.isArray(s.photos)?s.photos:[];return '<article class="client"><div class="clientHead"><div><h2>'+esc(s.businessName||'Untitled project')+'</h2><div class="muted">'+(s.submittedAt?new Date(s.submittedAt).toLocaleString():'Date unavailable')+'</div></div><div class="badges"><span class="badge '+(ok?'complete':'incomplete')+'">'+(ok?'COMPLETE':'INCOMPLETE')+'</span></div></div><div class="grid">'+item('Name',s.name)+item('Email',s.email,'',s.email?'mailto:'+encodeURIComponent(s.email):'')+item('Phone',s.phone,'',s.phone?'tel:'+encodeURIComponent(s.phone):'')+item('Timeline',s.timeline)+item('Website goal',s.goal)+item('Style',s.style)+item('Colors',s.colors)+item('Content',s.hasContent)+item('Business description',s.businessDescription,'full')+item('Additional information',s.additionalInfo,'full')+'<div class="item full"><div class="label">Pages / features</div><div class="value"><div class="chips">'+(Array.isArray(s.features)&&s.features.length?s.features.map(f=>'<span class="chip">'+esc(f)+'</span>').join(''):'Not provided')+'</div></div></div>'+(photos.length?'<div class="item full"><div class="label">Uploaded photos</div><div class="photos">'+photos.map(p=>'<a href="'+esc(p.url||p.publicUrl||'')+'" target="_blank" rel="noopener"><img src="'+esc(p.url||p.publicUrl||'')+'" alt="Uploaded client photo"></a>').join('')+'</div></div>':'')+'</div><div class="actions"><button class="action" onclick="editSubmission(\''+esc(s.id)+'\')">Edit</button><button class="action danger" onclick="deleteSubmission(\''+esc(s.id)+'\')">Delete</button></div></article>'}).join('')}
function editSubmission(id){const s=submissions.find(x=>String(x.id)===String(id));if(!s)return;$('e-id').value=s.id;$('e-name').value=s.name||'';$('e-business').value=s.businessName||'';$('e-email').value=s.email||'';$('e-phone').value=s.phone||'';$('e-goal').value=s.goal||'';$('e-style').value=s.style||'';$('e-colors').value=s.colors||'';$('e-timeline').value=s.timeline||'';$('e-content').value=s.hasContent||'';$('e-description').value=s.businessDescription||'';$('e-additional').value=s.additionalInfo||'';$('e-features').value=Array.isArray(s.features)?s.features.join(', '):'';$('editError').textContent='';$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
$('editForm').onsubmit=async e=>{e.preventDefault();const b={id:$('e-id').value,name:$('e-name').value,businessName:$('e-business').value,email:$('e-email').value,phone:$('e-phone').value,goal:$('e-goal').value,style:$('e-style').value,colors:$('e-colors').value,timeline:$('e-timeline').value,hasContent:$('e-content').value,businessDescription:$('e-description').value,additionalInfo:$('e-additional').value,features:$('e-features').value.split(',').map(x=>x.trim()).filter(Boolean)};try{const r=await fetch('/api/update',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Update failed');closeModal();await load()}catch(e){$('editError').textContent=e.message}}
async function deleteSubmission(id){if(!confirm('Delete this submission permanently?'))return;try{const r=await fetch('/api/delete?id='+encodeURIComponent(id),{method:'DELETE'});const d=await r.json();if(!r.ok)throw Error(d.error||'Delete failed');await load()}catch(e){alert(e.message)}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=logout;if(sessionStorage.getItem('aurixAdmin')==='1')openApp();
</script></body></html>
