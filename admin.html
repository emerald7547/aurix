<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIX Admin | Client Submissions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #000;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 107, 107, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            font-size: 1.5rem;
            color: #ff6b6b;
        }

        .logout-btn {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff6b6b;
            color: white;
        }

        .main {
            flex: 1;
            padding: 2rem;
        }

        .submissions-grid {
            display: grid;
            gap: 1.5rem;
        }

        .submission-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .submission-card:hover {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.08);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .card-header h2 {
            font-size: 1.3rem;
            color: #fff;
        }

        .status {
            padding: 0.4rem 1rem;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #ff8787;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 107, 107, 0.2);
        }

        .info-row {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .info-value {
            font-size: 1rem;
            color: #e0e0e0;
            font-weight: 500;
        }

        .phone-number {
            color: #ff6b6b;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .business-details {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #ff6b6b;
        }

        .business-details h4 {
            color: #ff8787;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .business-details p {
            color: #b0b0b0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .features-list {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .feature-tag {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #707070;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #a0a0a0;
        }

        .delete-btn {
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: rgba(200, 50, 50, 0.2);
            border: 1px solid rgba(200, 50, 50, 0.5);
            color: #ff6b6b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(200, 50, 50, 0.4);
        }

        .login-container {
            display: none;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.3);
            text-align: center;
            width: min(400px, 100%);
        }

        .login-box h1 {
            margin-bottom: 1.5rem;
            color: #ff6b6b;
        }

        .login-box input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .login-box button {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-container" style="display: flex;">
            <div class="login-box">
                <h1>AURIX Admin</h1>
                <p style="color: #b0b0b0; margin-bottom: 1.5rem;">Only you can access this area</p>
                <input type="password" id="adminPassword" placeholder="Enter admin password" />
                <button onclick="adminLogin()">Access Submissions</button>
                <p style="color: #707070; margin-top: 1rem; font-size: 0.9rem;">The password was sent to your email</p>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" style="display: none;" class="container">
            <div class="topbar">
                <h1>📋 Client Submissions</h1>
                <button class="logout-btn" onclick="adminLogout()">Logout</button>
            </div>

            <div class="main">
                <div id="submissionsList" class="submissions-grid"></div>
                <div id="emptyState" class="empty-state">
                    <h2>No submissions yet</h2>
                    <p>Client submissions will appear here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'emerald123';

        function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'flex';
                sessionStorage.setItem('adminLoggedIn', 'true');
                loadSubmissions();
            } else {
                alert('Invalid password');
            }
        }

        function adminLogout() {
            sessionStorage.removeItem('adminLoggedIn');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        function loadSubmissions() {
            fetch('/api/get-submissions')
                .then(res => res.json())
                .then(submissions => {
                    const list = document.getElementById('submissionsList');
                    const empty = document.getElementById('emptyState');

                    if (submissions.length === 0) {
                        list.innerHTML = '';
                        empty.style.display = 'block';
                    } else {
                        empty.style.display = 'none';
                        list.innerHTML = submissions.map(sub => `
                            <div class="submission-card">
                                <div class="card-header">
                                    <h2>${sub.businessName}</h2>
                                    <span class="status">New</span>
                                </div>
                                
                                <div class="contact-info">
                                    <div class="info-row">
                                        <span class="info-label">Name</span>
                                        <span class="info-value">${sub.name}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Email</span>
                                        <span class="info-value">${sub.email}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Phone (PRIVATE)</span>
                                        <span class="info-value phone-number">${sub.phone}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="info-label">Timeline</span>
                                        <span class="info-value">${sub.timeline}</span>
                                    </div>
                                </div>

                                <div class="business-details">
                                    <h4>Business Description</h4>
                                    <p>${sub.businessDescription}</p>
                                </div>

                                <div class="business-details">
                                    <h4>Website Goal</h4>
                                    <p>${sub.goal}</p>
                                </div>

                                <div class="business-details">
                                    <h4>Design Style</h4>
                                    <p>${sub.style}${sub.colors ? ' • ' + sub.colors : ''}</p>
                                </div>

                                ${sub.features.length > 0 ? `
                                    <div class="business-details">
                                        <h4>Requested Features</h4>
                                        <div class="features-list">
                                            ${sub.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                ${sub.additionalInfo ? `
                                    <div class="business-details">
                                        <h4>Additional Notes</h4>
                                        <p>${sub.additionalInfo}</p>
                                    </div>
                                ` : ''}

                                <div style="font-size: 0.85rem; color: #707070; margin-top: 1rem;">
                                    Submitted: ${new Date(sub.submittedAt).toLocaleString()}
                                </div>

                                <button class="delete-btn" onclick="deleteSubmission('${sub.id}')">Delete</button>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => console.error('Error loading submissions:', err));
        }

        function deleteSubmission(id) {
            if (confirm('Are you sure? This cannot be undone.')) {
                fetch(`/api/delete-submission/${id}`, { method: 'DELETE' })
                    .then(() => loadSubmissions())
                    .catch(err => console.error('Error:', err));
            }
        }

        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'flex';
            loadSubmissions();
        }

        setInterval(() => {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                loadSubmissions();
            }
        }, 10000);
    </script>
</body>
</html>
