<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIX | Admin Dashboard</title>
    <style>
        :root {
            --bg: #07080c;
            --card: #11131a;
            --card2: #171a22;
            --line: #292d38;
            --text: #f5f6fa;
            --muted: #9299aa;
            --accent: #b7ff4a;
            --danger: #ff6677;
            --warn: #ffbf69;
            --violet: #7445ff;
            --blue: #5d91ff;
            --pink: #d38aff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: radial-gradient(160% 100% at 50% 0%, #1a1e2e 0%, #0d0f14 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--line);
            background: rgba(17, 19, 26, 0.8)
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem
        }

        .eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700
        }

        .logout-btn {
            padding: 0.6rem 1.2rem;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease
        }

        .logout-btn:hover {
            background: var(--line);
            color: var(--danger)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem
        }

        .stat-card {
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
            border: 1px solid var(--line);
            border-radius: 12px
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 0.5rem
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent)
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem
        }

        .filter-btn.active {
            background: var(--violet);
            border-color: var(--violet);
            color: white
        }

        .filter-btn:hover {
            border-color: var(--violet)
        }

        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem
        }

        .submission-card {
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
            border: 1px solid var(--line);
            border-radius: 12px;
            transition: all 0.3s ease
        }

        .submission-card:hover {
            border-color: var(--violet);
            box-shadow: 0 12px 40px rgba(116, 69, 255, 0.2)
        }

        .card-header {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--line)
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 0.3rem;
            color: var(--accent)
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 0.9rem
        }

        .card-date {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 0.5rem
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 0.8rem
        }

        .info-row {
            display: flex;
            gap: 1rem
        }

        .info-label {
            color: var(--muted);
            font-size: 0.85rem;
            min-width: 100px
        }

        .info-value {
            color: var(--text);
            word-break: break-word;
            flex: 1
        }

        .info-value a {
            color: var(--blue);
            text-decoration: none
        }

        .info-value a:hover {
            text-decoration: underline
        }

        .features-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem
        }

        .feature-tag {
            padding: 0.3rem 0.7rem;
            background: rgba(116, 69, 255, 0.2);
            border: 1px solid var(--violet);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--accent)
        }

        .card-image {
            margin-top: 1rem;
            border-radius: 8px;
            overflow: hidden
        }

        .card-image img {
            width: 100%;
            height: 150px;
            object-fit: cover
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line)
        }

        .btn-small {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            background: var(--card);
            color: var(--text)
        }

        .btn-view {
            border-color: var(--blue);
            color: var(--blue)
        }

        .btn-view:hover {
            background: rgba(93, 145, 255, 0.1)
        }

        .btn-delete {
            border-color: var(--danger);
            color: var(--danger)
        }

        .btn-delete:hover {
            background: rgba(255, 102, 119, 0.1)
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted)
        }

        .empty-state h2 {
            color: var(--text);
            margin-top: 1rem
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 2rem
        }

        .modal.open {
            display: flex;
            align-items: center;
            justify-content: center
        }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 2rem
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1
        }

        .modal-title {
            clear: both;
            margin: 0 0 1.5rem;
            font-size: 1.5rem;
            font-weight: 700
        }

        .modal-content {
            display: flex;
            flex-direction: column;
            gap: 1rem
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--muted)
        }

        @media (max-width: 768px) {
            .submissions-grid {
                grid-template-columns: 1fr
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-top">
            <div>
                <div class="eyebrow">AURIX / Dashboard</div>
                <h1>Client Submissions</h1>
            </div>
            <button class="logout-btn" onclick="logout()">Log out</button>
        </div>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Submissions</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Complete Briefs</div>
                <div class="stat-value" id="completeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Incomplete</div>
                <div class="stat-value" id="incompleteCount">0</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterSubmissions('all')">All Submissions</button>
            <button class="filter-btn" onclick="filterSubmissions('complete')">Complete</button>
            <button class="filter-btn" onclick="filterSubmissions('incomplete')">Incomplete</button>
        </div>

        <div id="loading" class="loading">Loading submissions...</div>
        <div id="empty" class="empty-state" style="display: none;">
            <h2>No submissions yet</h2>
            <p>When clients submit their briefs, they'll appear here.</p>
        </div>
        <div id="submissionsList" class="submissions-grid"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 class="modal-title">Submission Details</h2>
            <div id="modalContent" class="modal-content"></div>
        </div>
    </div>

    <script>
        let submissions = [];
        let currentFilter = 'all';

        async function loadSubmissions() {
            try {
                const response = await fetch('/api/get');
                if (!response.ok) throw new Error('Failed to load');
                submissions = await response.json();
                renderSubmissions();
            } catch (error) {
                console.error('Error loading submissions:', error);
                document.getElementById('loading').innerHTML = '<p style="color: var(--danger);">Error loading submissions. Please refresh.</p>';
            }
        }

        function isComplete(s) {
            return !!(s.name && s.businessName && (s.email || s.phone || s.instagram) && s.goal);
        }

        function renderSubmissions() {
            const complete = submissions.filter(isComplete).length;
            const total = submissions.length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completeCount').textContent = complete;
            document.getElementById('incompleteCount').textContent = total - complete;

            let filtered = submissions;
            if (currentFilter === 'complete') {
                filtered = submissions.filter(isComplete);
            } else if (currentFilter === 'incomplete') {
                filtered = submissions.filter(s => !isComplete(s));
            }

            const listContainer = document.getElementById('submissionsList');
            document.getElementById('loading').style.display = 'none';

            if (filtered.length === 0) {
                document.getElementById('empty').style.display = 'block';
                listContainer.innerHTML = '';
                return;
            }

            document.getElementById('empty').style.display = 'none';
            listContainer.innerHTML = filtered.map(s => `
                <div class="submission-card">
                    <div class="card-header">
                        <div class="card-title">${escapeHtml(s.businessName || 'Untitled')}</div>
                        <div class="card-subtitle">${escapeHtml(s.name || 'Unknown')}</div>
                        <div class="card-date">${new Date(s.submittedAt).toLocaleDateString()}</div>
                    </div>
                    <div class="card-body">
                        ${s.email ? `<div class="info-row">
                            <span class="info-label">Email</span>
                            <span class="info-value"><a href="mailto:${escapeHtml(s.email)}">${escapeHtml(s.email)}</a></span>
                        </div>` : ''}
                        ${s.phone && s.phone !== 'Not provided' ? `<div class="info-row">
                            <span class="info-label">Phone</span>
                            <span class="info-value">${escapeHtml(s.phone)}</span>
                        </div>` : ''}
                        ${s.instagram && s.instagram !== 'Not provided' ? `<div class="info-row">
                            <span class="info-label">Instagram</span>
                            <span class="info-value"><a href="https://instagram.com/${escapeHtml(s.instagram).replace('@', '')}" target="_blank">${escapeHtml(s.instagram)}</a></span>
                        </div>` : ''}
                        ${s.businessDescription ? `<div class="info-row">
                            <span class="info-label">Description</span>
                            <span class="info-value">${escapeHtml(s.businessDescription)}</span>
                        </div>` : ''}
                        ${s.style ? `<div class="info-row">
                            <span class="info-label">Style</span>
                            <span class="info-value">${escapeHtml(s.style)}</span>
                        </div>` : ''}
                        ${s.colors ? `<div class="info-row">
                            <span class="info-label">Colors</span>
                            <span class="info-value">${escapeHtml(s.colors)}</span>
                        </div>` : ''}
                        ${s.timeline ? `<div class="info-row">
                            <span class="info-label">Timeline</span>
                            <span class="info-value">${escapeHtml(s.timeline)}</span>
                        </div>` : ''}
                        ${s.features && s.features.length > 0 ? `<div class="info-row">
                            <span class="info-label">Pages</span>
                            <div class="features-list">${s.features.map(f => `<span class="feature-tag">${escapeHtml(f)}</span>`).join('')}</div>
                        </div>` : ''}
                        ${s.imageUrl ? `<div class="card-image">
                            <img src="${escapeHtml(s.imageUrl)}" alt="Reference image">
                        </div>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="btn-small btn-view" onclick="viewDetails('${s.id}')">View Full</button>
                        <button class="btn-small btn-delete" onclick="deleteSubmission('${s.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function viewDetails(id) {
            const submission = submissions.find(s => s.id === id);
            if (!submission) return;

            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div style="background: var(--card2); padding: 1rem; border-radius: 8px;">
                    <h3 style="margin: 0 0 1rem; color: var(--accent);">${escapeHtml(submission.businessName)}</h3>
                    <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                        <div><strong>Name:</strong> ${escapeHtml(submission.name)}</div>
                        <div><strong>Email:</strong> ${submission.email ? `<a href="mailto:${escapeHtml(submission.email)}">${escapeHtml(submission.email)}</a>` : 'Not provided'}</div>
                        <div><strong>Phone:</strong> ${submission.phone || 'Not provided'}</div>
                        <div><strong>Instagram:</strong> ${submission.instagram || 'Not provided'}</div>
                        <div><strong>Business Description:</strong> ${escapeHtml(submission.businessDescription)}</div>
                        <div><strong>Website Goal:</strong> ${escapeHtml(submission.goal)}</div>
                        <div><strong>Style Preference:</strong> ${escapeHtml(submission.style)}</div>
                        <div><strong>Color Scheme:</strong> ${escapeHtml(submission.colors)}</div>
                        <div><strong>Has Content:</strong> ${escapeHtml(submission.hasContent)}</div>
                        <div><strong>Timeline:</strong> ${escapeHtml(submission.timeline)}</div>
                        <div><strong>Pages Needed:</strong> ${submission.features && submission.features.length > 0 ? submission.features.join(', ') : 'Not specified'}</div>
                        ${submission.additionalInfo ? `<div><strong>Additional Info:</strong> ${escapeHtml(submission.additionalInfo)}</div>` : ''}
                        ${submission.imageUrl ? `<div style="margin-top: 1rem;"><strong>Reference Image:</strong><img src="${escapeHtml(submission.imageUrl)}" alt="Reference" style="width: 100%; max-height: 300px; border-radius: 8px; margin-top: 0.5rem;"></div>` : ''}
                        <div style="margin-top: 1rem; color: var(--muted); font-size: 0.85rem;">Submitted: ${new Date(submission.submittedAt).toLocaleString()}</div>
                    </div>
                </div>
            `;
            modal.classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        function filterSubmissions(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderSubmissions();
        }

        async function deleteSubmission(id) {
            if (!confirm('Are you sure you want to delete this submission?')) return;

            try {
                const response = await fetch(`/api/delete?id=${encodeURIComponent(id)}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    submissions = submissions.filter(s => s.id !== id);
                    renderSubmissions();
                }
            } catch (error) {
                console.error('Error deleting:', error);
                alert('Failed to delete submission');
            }
        }

        function logout() {
            if (confirm('Log out?')) {
                sessionStorage.removeItem('aurixAdmin');
                location.reload();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load submissions on page load
        loadSubmissions();
        // Refresh every 30 seconds
        setInterval(loadSubmissions, 30000);
    </script>
</body>

</html>
