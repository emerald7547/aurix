<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AURIX | Admin Dashboard</title><style>:root{--card:#11131a;--card2:#171a22;--line:#292d38;--text:#f5f6fa;--muted:#9299aa;--accent:#b7ff4a;--danger:#ff6677;--violet:#7445ff;--blue:#5d91ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(160% 100% at 50% 0%,#1a1e2e,#0d0f14);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:1.5rem 2rem;border-bottom:1px solid var(--line);background:#11131acc}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}.eyebrow,.muted{color:var(--muted);font-size:.82rem}.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}h1{margin:6px 0 0}.btn,.logout{padding:.6rem 1rem;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:7px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.stat,.card{padding:1.25rem;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:12px}.stat-value{font-size:2rem;font-weight:700;color:var(--accent)}.container{max-width:1450px;margin:auto;padding:2rem}.filters{display:flex;gap:.7rem;margin-bottom:1.5rem;flex-wrap:wrap}.active{background:var(--violet)!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:1.3rem}.card:hover{border-color:var(--violet)}.title{font-size:1.2rem;font-weight:700;color:var(--accent)}.date{color:var(--muted);font-size:.8rem;margin-top:.4rem}.status{display:inline-flex;margin-top:.7rem;padding:.3rem .65rem;border-radius:99px;font-size:.72rem;text-transform:uppercase}.pending{background:#3d3320;color:#ffd37b}.approved{background:#183b20;color:#7dff9a}.building{background:#30215f;color:#c7b5ff}.deploying{background:#173b5a;color:#8ed2ff}.complete{background:#264b14;color:#b7ff4a}.body{margin-top:1rem;display:grid;gap:.65rem}.row{display:flex;gap:1rem}.label{min-width:95px;color:var(--muted);font-size:.85rem}.value{word-break:break-word}.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}.actions .btn{flex:1;min-width:90px}.approve{border-color:#65d77c;color:#7dff9a}.completeBtn{border-color:var(--accent);color:var(--accent)}.delete{border-color:var(--danger);color:var(--danger)}.view{border-color:var(--blue);color:var(--blue)}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;padding:2rem;align-items:center;justify-content:center}.modal.open{display:flex}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(800px,100%);max-height:90vh;overflow:auto;padding:2rem}.close{float:right;background:none;border:0;color:white;font-size:1.5rem}.section{background:var(--card2);padding:1rem;border-radius:8px;margin:1rem 0}.section h3{color:var(--accent);margin-top:0}.detail{padding:.5rem 0;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}.images{display:flex;gap:.7rem;flex-wrap:wrap}.images img{width:130px;height:100px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}@media(max-width:700px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.row{flex-direction:column;gap:.2rem}}</style></head><body><header><div class="top"><div><div class="eyebrow">AURIX / Dashboard</div><h1>Client Submissions</h1></div><button class="logout" onclick="logout()">Log out</button></div><div class="stats"><div class="stat"><div class="muted">Total Submissions</div><div class="stat-value" id="total">0</div></div><div class="stat"><div class="muted">Completed</div><div class="stat-value" id="done">0</div></div><div class="stat"><div class="muted">Open Slots</div><div class="stat-value" id="slots">5</div></div></div></header><div class="container"><div class="filters"><button class="btn active" onclick="setFilter('all',this)">All</button><button class="btn" onclick="setFilter('pending',this)">Not Approved</button><button class="btn" onclick="setFilter('approved',this)">Approved</button><button class="btn" onclick="setFilter('building',this)">Building</button><button class="btn" onclick="setFilter('deploying',this)">Deploying</button><button class="btn" onclick="setFilter('complete',this)">Complete</button></div><div id="list" class="grid"></div></div><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>Complete Submission</h2><div id="details"></div></div></div><script>
let data=[],filter='all';const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};async function load(){try{const r=await fetch('/api/get?x='+Date.now());data=await r.json();render()}catch(e){document.getElementById('list').innerHTML='<p class="muted">Unable to load submissions.</p>'}}function render(){document.getElementById('total').textContent=data.length;document.getElementById('done').textContent=data.filter(x=>x.status==='complete').length;document.getElementById('slots').textContent=Math.max(0,5-data.length);const a=filter==='all'?data:data.filter(x=>(x.status||'pending')===filter);document.getElementById('list').innerHTML=a.map(s=>`<article class="card"><div class="title">${esc(s.businessName||'Untitled')}</div><div>${esc(s.name||'Unknown')}</div><div class="date">${s.submittedAt?new Date(s.submittedAt).toLocaleString():''}</div><span class="status ${esc(s.status||'pending')}">${esc(s.status||'pending')}</span><div class="body"><div class="row"><span class="label">Email</span><span class="value">${esc(s.email)}</span></div><div class="row"><span class="label">Instagram</span><span class="value">${esc(s.instagram||'Not provided')}</span></div><div class="row"><span class="label">Goal</span><span class="value">${esc(s.goal||'Not provided')}</span></div><div class="row"><span class="label">Timeline</span><span class="value">${esc(s.timeline||'Not provided')}</span></div></div><div class="actions"><button class="btn view" onclick="view('${esc(s.id)}')">Full Details</button>${s.status==='pending'?`<button class="btn approve" onclick="act('${esc(s.id)}','approve')">Approve</button>`:''}${s.status==='approved'?`<button class="btn" onclick="act('${esc(s.id)}','building')">Building</button>`:''}${s.status==='building'?`<button class="btn" onclick="act('${esc(s.id)}','deploying')">Deploying</button>`:''}${['approved','building','deploying'].includes(s.status)?`<button class="btn completeBtn" onclick="act('${esc(s.id)}','complete')">Complete</button>`:''}<button class="btn delete" onclick="act('${esc(s.id)}','delete')">Delete</button></div></article>`).join('')||'<p class="muted">No submissions in this view.</p>'}async function act(id,action){if(!confirm(action==='delete'?'Delete this submission permanently?':action[0].toUpperCase()+action.slice(1)+' this submission?'))return;const r=await fetch('/api/admin-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});if(!r.ok){alert((await r.json()).error||'Action failed');return}load()}function view(id){const s=data.find(x=>x.id===id);if(!s)return;const row=(l,v)=>`<div class="detail"><b class="muted">${l}</b><br>${esc(v||'Not provided')}</div>`;document.getElementById('details').innerHTML=`<div class="section"><h3>Contact & Business</h3>${row('Name',s.name)}${row('Email',s.email)}${row('Phone',s.phone)}${row('Instagram',s.instagram)}${row('Business',s.businessName)}${row('Description',s.businessDescription)}</div><div class="section"><h3>Project Brief</h3>${row('Goal',s.goal)}${row('Style',s.style)}${row('Colors',s.colors)}${row('Content',s.hasContent)}${row('Timeline',s.timeline)}${row('Pages / Features',s.features?.join(', '))}${row('Additional Info',s.additionalInfo)}</div><div class="section"><h3>Deployment</h3>${row('Status',s.status)}${row('Message',s.statusMessage)}${row('Submitted',s.submittedAt?new Date(s.submittedAt).toLocaleString():'')}${row('Approved',s.approvedAt?new Date(s.approvedAt).toLocaleString():'')}${row('Completed',s.completedAt?new Date(s.completedAt).toLocaleString():'')}</div><div class="section"><h3>Uploaded Images</h3><div class="images">${(s.images||[]).map(i=>`<img src="${esc(i.data)}" alt="Reference image">`).join('')||'<span class="muted">No images uploaded.</span>'}</div></div>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function setFilter(f,b){filter=f;document.querySelectorAll('.filters .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function logout(){sessionStorage.removeItem('aurixAdmin');location.reload()}load();setInterval(load,10000);
</script></body></html>
