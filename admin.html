<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX | Admin</title><style>:root{--bg:#080a12;--card:#11131a;--line:#292d38;--text:#f5f6fa;--muted:#9299aa;--accent:#b7ff4a;--danger:#ff6677;--violet:#7445ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(160% 100% at 50% 0%,#1a1e2e,#0d0f14);color:var(--text);font-family:Arial,sans-serif}.lock{min-height:100vh;display:grid;place-items:center}.login{width:min(400px,90%);padding:32px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center}.login input{width:100%;padding:13px;margin:18px 0 10px;border:1px solid var(--line);border-radius:8px;background:#080a12;color:#fff;box-sizing:border-box}.btn{padding:10px 16px;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:7px;cursor:pointer}.primary{background:var(--violet);width:100%}.error{color:var(--danger);min-height:20px}.app{display:none}header{padding:24px 32px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:var(--muted);font-size:.85rem}.stats{display:flex;gap:16px;margin-top:20px}.stat{padding:16px 24px;background:var(--card);border:1px solid var(--line);border-radius:10px}.stat b{display:block;font-size:28px;color:var(--accent)}main{max-width:1450px;margin:auto;padding:30px}.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.active{background:var(--violet)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}.card{padding:20px;background:linear-gradient(135deg,var(--card),#171a22);border:1px solid var(--line);border-radius:12px}.title{font-size:19px;font-weight:700;color:var(--accent)}.status{display:inline-block;margin:10px 0;padding:5px 10px;border-radius:99px;font-size:11px;text-transform:uppercase}.pending{background:#3d3320}.approved{background:#183b20}.building{background:#30215f}.deploying{background:#173b5a}.complete{background:#264b14}.row{display:flex;gap:15px;margin:9px 0}.label{color:var(--muted);width:90px}.actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.approve{color:#7dff9a}.delete{color:var(--danger)}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;padding:30px;align-items:center;justify-content:center}.modal.open{display:flex}.modalbox{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(800px,100%);max-height:90vh;overflow:auto;padding:28px}.section{background:#171a22;padding:16px;border-radius:8px;margin:12px 0}.section h3{color:var(--accent)}.images{display:flex;gap:8px;flex-wrap:wrap}.images img{width:130px;height:100px;object-fit:cover;border-radius:7px}@media(max-width:700px){.stats{flex-direction:column}.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><section id="lock" class="lock"><div class="login"><div class="muted">AURIX / PRIVATE AREA</div><h1>Admin Dashboard</h1><p class="muted">Enter the admin password to continue.</p><input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password"><button class="btn primary" onclick="login()">Unlock Dashboard</button><p id="loginError" class="error"></p></div></section><section id="app" class="app"><header><div class="top"><div><div class="muted">AURIX / PRIVATE DASHBOARD</div><h1>Client Submissions</h1></div><button class="btn" onclick="logout()">Lock</button></div><div class="stats"><div class="stat"><span class="muted">Total</span><b id="total">0</b></div><div class="stat"><span class="muted">Completed</span><b id="done">0</b></div><div class="stat"><span class="muted">Open Slots</span><b id="slots">5</b></div></div></header><main><div class="filters"><button class="btn active" onclick="filterBy('all',this)">All</button><button class="btn" onclick="filterBy('pending',this)">Not Approved</button><button class="btn" onclick="filterBy('approved',this)">Approved</button><button class="btn" onclick="filterBy('building',this)">Building</button><button class="btn" onclick="filterBy('deploying',this)">Deploying</button><button class="btn" onclick="filterBy('complete',this)">Complete</button></div><div id="list" class="grid"></div></main></section><div id="modal" class="modal"><div class="modalbox"><button class="btn" onclick="closeModal()">Close</button><div id="details"></div></div></div><script>let data=[],filter='all';const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};async function login(){const p=adminPassword.value;const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok){loginError.textContent=d.error||'Invalid password';return}sessionStorage.setItem('aurixAdmin','1');show()}function show(){lock.style.display='none';app.style.display='block';load()}function logout(){sessionStorage.removeItem('aurixAdmin');location.reload()}async function load(){const r=await fetch('/api/get?x='+Date.now(),{cache:'no-store'});if(!r.ok)return;data=await r.json();render()}function render(){total.textContent=data.length;done.textContent=data.filter(s=>s.status==='complete').length;slots.textContent=Math.max(0,5-data.length);const a=filter==='all'?data:data.filter(s=>(s.status||'pending')===filter);list.innerHTML=a.map(s=>`<article class="card"><div class="title">${esc(s.businessName)}</div><div>${esc(s.name)}</div><span class="status ${esc(s.status||'pending')}">${esc(s.status||'pending')}</span><div class="row"><span class="label">Email</span><span>${esc(s.email)}</span></div><div class="row"><span class="label">Instagram</span><span>${esc(s.instagram||'Not provided')}</span></div><div class="row"><span class="label">Goal</span><span>${esc(s.goal||'Not provided')}</span></div><div class="actions"><button class="btn" onclick="view('${esc(s.id)}')">Full Details</button>${s.status==='pending'?'<button class="btn approve" onclick="act(\''+esc(s.id)+'\',\'approve\')">Approve</button>':''}${s.status==='approved'?'<button class="btn" onclick="act(\''+esc(s.id)+'\',\'building\')">Building</button>':''}${s.status==='building'?'<button class="btn" onclick="act(\''+esc(s.id)+'\',\'deploying\')">Deploying</button>':''}${['approved','building','deploying'].includes(s.status)?'<button class="btn" onclick="act(\''+esc(s.id)+'\',\'complete\')">Complete</button>':''}<button class="btn delete" onclick="act(\''+esc(s.id)+'\',\'delete\')">Delete</button></div></article>`).join('')||'<p class="muted">No submissions.</p>'}async function act(id,action){if(!confirm(action==='delete'?'Delete permanently?':action+' this submission?'))return;const r=await fetch('/api/admin-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});let result={};try{result=await r.json()}catch(e){}if(!r.ok||!result.success){alert(result.error||'Action failed');return}data=data.filter(s=>String(s.id)!==String(id));if(filter!=='all'&&!data.some(s=>String(s.id)===String(id))){}render();if(action==='delete')setTimeout(load,150)}function view(id){const s=data.find(x=>x.id===id);if(!s)return;const row=(l,v)=>`<div class="section"><b class="muted">${l}</b><br>${esc(v||'Not provided')}</div>`;details.innerHTML=`<h2>${esc(s.businessName)}</h2>${row('Name',s.name)}${row('Email',s.email)}${row('Instagram',s.instagram)}${row('Business Description',s.businessDescription)}${row('Goal',s.goal)}${row('Style',s.style)}${row('Colors',s.colors)}${row('Content',s.hasContent)}${row('Timeline',s.timeline)}${row('Features',s.features?.join(', '))}${row('Additional Info',s.additionalInfo)}${row('Status',s.statusMessage||s.status)}<div class="section"><h3>Uploaded Images</h3><div class="images">${(s.images||[]).map(i=>`<img src="${esc(i.data)}" alt="${esc(i.name||'Uploaded image')}">`).join('')||'None'}</div></div>`;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function filterBy(f,b){filter=f;document.querySelectorAll('.filters .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}if(sessionStorage.getItem('aurixAdmin')==='1')show()</script></body></html>
