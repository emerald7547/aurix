<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AURIX Admin | Client Submissions</title></head>
<body><div id="loginScreen"><h1>AURIX Admin</h1><p>Only you can access this area</p><input type="password" id="adminPassword" placeholder="Enter admin password"><button onclick="adminLogin()">Access Submissions</button></div><div id="adminDashboard" style="display:none"><h1>📋 Client Submissions</h1><button onclick="adminLogout()">Logout</button><div id="submissionsList"></div></div><script>
async function adminLogin(){const password=document.getElementById('adminPassword').value;const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(r.ok){sessionStorage.setItem('adminLoggedIn','true');showDashboard();}else{const d=await r.json().catch(()=>({}));alert(d.error||'Invalid password');}}
function adminLogout(){sessionStorage.removeItem('adminLoggedIn');location.reload();}
function showDashboard(){document.getElementById('loginScreen').style.display='none';document.getElementById('adminDashboard').style.display='block';loadSubmissions();}
async function loadSubmissions(){const r=await fetch('/api/get');const submissions=await r.json();const list=document.getElementById('submissionsList');if(!Array.isArray(submissions)||!submissions.length){list.innerHTML='<p>No submissions yet</p>';return;}list.innerHTML=submissions.map(s=>`<article><h2>${escapeHtml(s.businessName)}</h2><p><b>Name:</b> ${escapeHtml(s.name)}</p><p><b>Email:</b> ${escapeHtml(s.email)}</p><p><b>Phone:</b> ${escapeHtml(s.phone)}</p><p><b>Timeline:</b> ${escapeHtml(s.timeline)}</p><p><b>Description:</b> ${escapeHtml(s.businessDescription)}</p><p><b>Goal:</b> ${escapeHtml(s.goal)}</p><p><b>Style:</b> ${escapeHtml(s.style)}</p><p><b>Colors:</b> ${escapeHtml(s.colors)}</p><p><b>Submitted:</b> ${new Date(s.submittedAt).toLocaleString()}</p></article>`).join('');}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
if(sessionStorage.getItem('adminLoggedIn')==='true')showDashboard();
</script></body></html>
