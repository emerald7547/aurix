<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX | Project Status</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a12;color:#f5f4f1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{width:min(680px,90vw)}.brand{font-weight:800;letter-spacing:.08em;margin-bottom:3rem}.eyebrow{font-size:.72rem;letter-spacing:.18em;color:#9299aa;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,4rem);margin:.5rem 0 1rem}.msg{color:#aaa;line-height:1.6}.track{margin-top:3rem;display:grid;gap:1rem}.step{display:flex;align-items:center;gap:1rem;padding:1rem;border:1px solid #292d38;border-radius:12px;background:#11131a}.dot{width:14px;height:14px;border-radius:50%;background:#292d38;box-shadow:0 0 0 6px #171a22}.step.active .dot{background:#7445ff;box-shadow:0 0 20px #7445ff}.step.done .dot{background:#b7ff4a}.step strong{display:block}.small{color:#9299aa;font-size:.85rem;margin-top:.25rem}.badge{display:inline-block;padding:.4rem .7rem;border-radius:999px;background:#30215f;color:#c7b5ff;font-size:.75rem;text-transform:uppercase}.error{color:#ff6677}</style></head><body><main class="wrap"><div class="brand">AURIX</div><div class="eyebrow">PROJECT STATUS</div><h1 id="title">Loading…</h1><div id="badge" class="badge">Checking</div><p id="msg" class="msg">We're checking your project status.</p><div class="track"><div id="s1" class="step"><span class="dot"></span><div><strong>Submission received</strong><div class="small">Your brief is safely saved.</div></div></div><div id="s2" class="step"><span class="dot"></span><div><strong>Approved</strong><div class="small">Your project has been reviewed.</div></div></div><div id="s3" class="step"><span class="dot"></span><div><strong>Building</strong><div class="small">Your website is being created.</div></div></div><div id="s4" class="step"><span class="dot"></span><div><strong>Deploying</strong><div class="small">Your website is going live.</div></div></div><div id="s5" class="step"><span class="dot"></span><div><strong>Complete</strong><div class="small">Your website is ready.</div></div></div></div></main><script>const id=new URLSearchParams(location.search).get('id');const order=['pending','approved','building','deploying','complete'];async function load(){if(!id){document.getElementById('title').textContent='Missing project ID';return}try{const r=await fetch('/api/status?id='+encodeURIComponent(id));const s=await r.json();if(!r.ok)throw Error(s.error);document.getElementById('title').textContent=s.businessName||'Your project';document.getElementById('badge').textContent=s.status;document.getElementById('msg').textContent=s.statusMessage||'Your project status will update here.';const n=order.indexOf(s.status);['s1','s2','s3','s4','s5'].forEach((x,i)=>{const e=document.getElementById(x);if(i<=n)e.classList.add('done');if(i===n)e.classList.add('active')})}catch(e){document.getElementById('title').textContent='Status unavailable';document.getElementById('msg').textContent=e.message;document.getElementById('msg').className='msg error'}}load();setInterval(load,10000);</script></body></html>
