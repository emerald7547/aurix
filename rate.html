<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIX | Rate Our Work</title>
    <style>
        :root { --ink:#080a12; --paper:#f5f4f1; --violet:#7445ff; --blue:#5d91ff; --pink:#d38aff; --line:#d8d6d0; }
        * { box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { min-height:100vh; margin:0; color:var(--ink); background:var(--paper); font-family:Arial,sans-serif; }
        @media (pointer:fine) { body,a,button,input { cursor:none; } }
        .brush-cursor { position:fixed; z-index:1000; display:grid; place-items:center; width:42px; height:42px; pointer-events:none; opacity:0; color:var(--violet); font:2.3rem/1 Georgia,serif; text-shadow:2px 4px 3px rgba(0,0,0,.35); transform:translate3d(-100px,-100px,0) rotate(-12deg); transform-origin:center; transition:opacity .2s ease,filter .2s ease; }
        .brush-cursor.is-visible { opacity:1; } .brush-cursor.is-hovering { filter:drop-shadow(0 0 7px rgba(116,69,255,.9)); }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1.25rem 5vw; color:white; background:var(--ink); }
        .brand { color:white; font:700 1.2rem Georgia,serif; letter-spacing:.16em; text-decoration:none; } .progress { color:#aaa9b8; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; }
        .page-wrap { width:min(1080px,calc(100% - 2rem)); margin:0 auto; padding:clamp(3rem,7vw,6rem) 0; }
        .intro { max-width:720px; margin-bottom:3.5rem; } .kicker { margin:0 0 1rem; color:var(--violet); font-size:.72rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
        h1 { margin:0; font:400 clamp(3rem,9vw,7.5rem)/.88 Georgia,serif; letter-spacing:-.03em; } .intro-copy { max-width:540px; margin:1.5rem 0 0; color:#5d5c67; line-height:1.7; }
        .section { padding:clamp(1.5rem,4vw,3rem); background:white; border:1px solid var(--line); box-shadow:0 15px 50px rgba(8,10,18,.06); }
        .section-heading { display:flex; align-items:start; gap:1rem; margin-bottom:2rem; } .section-number { color:var(--violet); font:700 .75rem Arial,sans-serif; letter-spacing:.12em; } h2 { margin:0; font:400 clamp(1.8rem,4vw,3.3rem)/1 Georgia,serif; }
        .rating-value { display:block; min-height:2rem; margin:0 0 1.25rem; color:var(--violet); font:700 1.1rem Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; } .rating-slider { width:100%; height:2rem; margin:0; accent-color:var(--violet); }
        .rating-labels { display:flex; justify-content:space-between; gap:.5rem; margin-top:.75rem; color:#777580; font-size:.68rem; text-transform:uppercase; } .rate-button { margin-top:2rem; padding:1.1rem 1.5rem; color:white; border:0; background:linear-gradient(100deg,var(--violet),var(--blue)); font-weight:700; letter-spacing:.08em; text-transform:uppercase; box-shadow:0 12px 28px rgba(116,69,255,.25); transition:transform .25s ease,box-shadow .25s ease; }
        .rate-button:hover { transform:translateY(-3px); box-shadow:0 18px 35px rgba(116,69,255,.4); } .rating-message { min-height:1.5rem; margin:1rem 0 0; color:var(--violet); font-size:.82rem; } .back-link { display:inline-block; margin-top:2rem; color:var(--violet); font-weight:700; }
        @media (max-width:650px) { .topbar{align-items:flex-start;flex-direction:column}.rate-button{width:100%}.rating-labels{font-size:.58rem} }
        @media (pointer:coarse) { .brush-cursor{display:none} }
    </style>
</head>
<body>
    <div class="brush-cursor" aria-hidden="true">★</div>
    <header class="topbar"><a class="brand" href="index.html">AURIX</a><span class="progress">Client feedback / final step</span></header>
    <main class="page-wrap">
        <header class="intro"><p class="kicker">AURIX feedback</p><h1>Rate our work.</h1><p class="intro-copy">Your perspective helps us keep making digital experiences that feel considered, useful, and unmistakably yours.</p></header>
        <section class="section"><div class="section-heading"><span class="section-number">01</span><h2>How does it feel?</h2></div><output id="ratingValue" class="rating-value" for="workRating">Brilliant</output><input id="workRating" class="rating-slider" type="range" min="1" max="5" value="4" aria-label="Rate our work"><div class="rating-labels" aria-hidden="true"><span>Cool</span><span>Good</span><span>Great</span><span>Brilliant</span><span>Amazing</span></div><button id="rateButton" class="rate-button" type="button">Submit rating</button><p id="ratingMessage" class="rating-message" role="status"></p></section>
        <a class="back-link" href="index.html">Back to AURIX</a>
    </main>
    <script>
        const brushCursor=document.querySelector('.brush-cursor'),interactiveElements=document.querySelectorAll('a,button,input'),ratingSlider=document.querySelector('#workRating'),ratingValue=document.querySelector('#ratingValue'),rateButton=document.querySelector('#rateButton'),ratingMessage=document.querySelector('#ratingMessage'),ratingLabels=['Cool','Good','Great','Brilliant','Amazing'];
        const updateRating=()=>{const selectedRating=ratingLabels[Number(ratingSlider.value)-1];ratingValue.value=selectedRating;ratingValue.textContent=selectedRating;ratingMessage.textContent='';rateButton.textContent='Submit rating'};
        ratingSlider.addEventListener('input',updateRating); ratingSlider.addEventListener('change',updateRating); rateButton.addEventListener('click',()=>{ratingMessage.textContent=`Thanks for rating AURIX ${ratingValue.textContent.toLowerCase()}!`;rateButton.textContent='Rating saved'});
        if(brushCursor&&window.matchMedia('(pointer:fine)').matches){window.addEventListener('pointermove',event=>{brushCursor.style.transform=`translate3d(${event.clientX-10}px,${event.clientY-10}px,0) rotate(-30deg)`;brushCursor.classList.add('is-visible')});document.addEventListener('mouseleave',()=>brushCursor.classList.remove('is-visible'));interactiveElements.forEach(element=>{element.addEventListener('mouseenter',()=>brushCursor.classList.add('is-hovering'));element.addEventListener('mouseleave',()=>brushCursor.classList.remove('is-hovering'))})}
    </script>
</body>
</html>
