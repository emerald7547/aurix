<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIX | Rate Our Work</title>
    <style>
        :root { --ink: #080a12; --paper: #f5f4f1; --violet: #7445ff; --blue: #5d91ff; --pink: #d38aff; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: white; background: radial-gradient(circle at 50% 0%, #27234f, var(--ink) 62%); font-family: Arial, sans-serif; }
        @media (pointer: fine) { body, a, button, input { cursor: none; } }
        .brush-cursor { position: fixed; z-index: 1000; top: 0; left: 0; width: 54px; height: 54px; pointer-events: none; opacity: 0; transform: translate3d(-100px, -100px, 0) rotate(-30deg); transform-origin: 12px 12px; filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, .45)); transition: opacity .2s ease, filter .2s ease; }
        .brush-cursor img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .brush-cursor.is-visible { opacity: 1; }
        .brush-cursor.is-hovering { filter: drop-shadow(0 0 8px rgba(211, 138, 255, .95)); }
        .rating-page { width: min(720px, calc(100% - 2rem)); padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid rgba(255, 255, 255, .2); background: rgba(8, 10, 18, .72); box-shadow: 0 25px 90px rgba(0, 0, 0, .4); backdrop-filter: blur(12px); }
        .kicker { margin: 0 0 1rem; color: var(--pink); font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
        h1 { margin: 0; font: 400 clamp(3rem, 9vw, 7rem)/.9 Georgia, serif; }
        .intro { max-width: 480px; margin: 1.5rem auto 2.5rem; color: #d8d6e4; line-height: 1.7; }
        .rating-box { padding: clamp(1.5rem, 4vw, 2.5rem); border: 1px solid rgba(255, 255, 255, .2); background: linear-gradient(145deg, rgba(116, 69, 255, .22), rgba(93, 145, 255, .08)); }
        h2 { margin: 0 0 1.5rem; font: 400 clamp(1.6rem, 4vw, 2.5rem)/1 Georgia, serif; }
        .rating-value { display: block; min-height: 2rem; margin-bottom: 1rem; color: var(--pink); font: 700 1.1rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        .rating-slider { width: 100%; accent-color: var(--pink); }
        .rating-labels { display: flex; justify-content: space-between; gap: .5rem; margin-top: .75rem; color: #aaa8b8; font-size: .68rem; text-transform: uppercase; }
        .rate-button { margin-top: 1.75rem; padding: 1rem 1.5rem; color: white; border: 1px solid rgba(255, 255, 255, .5); background: linear-gradient(100deg, var(--violet), var(--blue)); font: 700 .72rem Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 10px 25px rgba(116, 69, 255, .3); transition: transform .25s ease, box-shadow .25s ease; }
        .rate-button:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(116, 69, 255, .5); }
        .rating-message { min-height: 1.5rem; margin: 1rem 0 0; color: var(--pink); font-size: .82rem; }
        .back-link { display: inline-block; margin-top: 2rem; color: #cbc8dc; font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }
        .back-link:hover { color: white; }
        @media (max-width: 500px) { .rating-labels { font-size: .55rem; } }
        @media (pointer: coarse), (prefers-reduced-motion: reduce) { .brush-cursor { display: none; } }
    </style>
</head>
<body>
    <div class="brush-cursor" aria-hidden="true"><img src="paint-brush-fill.svg" alt=""></div>
    <main class="rating-page">
        <p class="kicker">AURIX feedback</p>
        <h1>Rate our work</h1>
        <p class="intro">Your perspective helps us keep making digital experiences that feel considered, useful, and unmistakably yours.</p>
        <div class="rating-box">
            <h2>How does it feel?</h2>
            <output id="ratingValue" class="rating-value" for="workRating">Brilliant</output>
            <input id="workRating" class="rating-slider" type="range" min="1" max="5" value="4" aria-label="Rate our work">
            <div class="rating-labels" aria-hidden="true"><span>Cool</span><span>Good</span><span>Great</span><span>Brilliant</span><span>Amazing</span></div>
            <button id="rateButton" class="rate-button" type="button">Submit rating</button>
            <p id="ratingMessage" class="rating-message" role="status"></p>
        </div>
        <a class="back-link" href="index.html">Back to AURIX</a>
    </main>
    <script>
        const brushCursor = document.querySelector('.brush-cursor');
        const interactiveElements = document.querySelectorAll('a, button, input');
        const ratingSlider = document.querySelector('#workRating');
        const ratingValue = document.querySelector('#ratingValue');
        const rateButton = document.querySelector('#rateButton');
        const ratingMessage = document.querySelector('#ratingMessage');
        const ratingLabels = ['Cool', 'Good', 'Great', 'Brilliant', 'Amazing'];

        ratingSlider.addEventListener('input', () => { ratingValue.value = ratingLabels[ratingSlider.value - 1]; ratingValue.textContent = ratingLabels[ratingSlider.value - 1]; ratingMessage.textContent = ''; rateButton.textContent = 'Submit rating'; });
        rateButton.addEventListener('click', () => { ratingMessage.textContent = `Thanks for rating AURIX ${ratingValue.textContent.toLowerCase()}!`; rateButton.textContent = 'Rating saved'; });
        if (brushCursor && window.matchMedia('(pointer: fine)').matches) {
            window.addEventListener('pointermove', (event) => { brushCursor.style.transform = `translate3d(${event.clientX - 10}px, ${event.clientY - 10}px, 0) rotate(-30deg)`; brushCursor.classList.add('is-visible'); });
            document.addEventListener('mouseleave', () => brushCursor.classList.remove('is-visible'));
            interactiveElements.forEach((element) => { element.addEventListener('mouseenter', () => brushCursor.classList.add('is-hovering')); element.addEventListener('mouseleave', () => brushCursor.classList.remove('is-hovering')); });
        }
    </script>
</body>
</html>
