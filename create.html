<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AURIX | Project Brief</title>
<style>
:root{--ink:#080a12;--paper:#f5f4f1;--violet:#7445ff;--blue:#5d91ff;--pink:#d38aff;--line:#d8d6d0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;padding:20px}.container{max-width:900px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:24px;font-weight:700;color:var(--ink);text-decoration:none}.progress{font-size:14px;color:#999}h1{font-size:32px;margin-top:0;margin-bottom:8px}.subtitle{font-size:16px;color:#666;margin-bottom:30px}.form-group{margin-bottom:24px}label{display:block;font-weight:600;margin-bottom:8px;color:var(--ink)}input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:white;color:var(--ink)}textarea{resize:vertical;min-height:100px}.checkbox-group{display:flex;flex-wrap:wrap;gap:16px}.checkbox-item{display:flex;align-items:center;gap:8px}.checkbox-item label{margin:0;font-weight:400}input[type=checkbox]{width:18px;height:18px;cursor:pointer}.button-group{display:flex;gap:12px;margin-top:32px}button{padding:12px 24px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s ease}.submit-button{background:var(--violet);color:white;flex:1}.submit-button:hover{opacity:.9;transform:translateY(-2px)}.submit-button:disabled{opacity:.5;cursor:not-allowed;transform:none}.reset-button{background:var(--line);color:var(--ink)}.reset-button:hover{background:#ccc}.status-message{padding:12px;border-radius:6px;margin-top:16px;display:none;font-size:14px}.status-message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;display:block}.status-message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;display:block}.status-message.loading{background:#e7f3ff;color:#0c5aa0;border:1px solid #b3d9ff;display:block}
/* AURIX cinematic painting intro */
.paint-intro{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#070812;overflow:hidden;pointer-events:none;animation:paintIntroOut .9s 4.25s cubic-bezier(.7,0,.3,1) forwards}.paint-intro:before{content:"";position:absolute;width:65vw;height:65vw;border-radius:50%;background:radial-gradient(circle,rgba(116,69,255,.22),transparent 65%);filter:blur(30px);animation:aurora 4s ease-in-out both}.paint-stage{position:relative;width:min(820px,94vw);height:min(590px,78vh);display:grid;place-items:center}.real-canvas{position:absolute;width:78%;height:68%;background:#fff;border:1px solid rgba(255,255,255,.8);box-shadow:0 35px 110px rgba(0,0,0,.65),0 0 70px rgba(116,69,255,.12);transform:rotate(-3deg) scale(.55);opacity:0;animation:canvasIn .8s .15s cubic-bezier(.16,1,.3,1) forwards}.real-canvas:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.7),transparent 35%,rgba(116,69,255,.06));mix-blend-mode:screen}.paint-surface{position:absolute;width:78%;height:68%;overflow:hidden;transform:rotate(-3deg) scale(.55);opacity:0;animation:canvasIn .8s .15s cubic-bezier(.16,1,.3,1) forwards}.paint-surface:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.35) 48%,transparent 60%);transform:translateX(-120%);animation:shine 1.2s 2.9s ease-out forwards}.paint-blob{position:absolute;border-radius:45% 55% 50% 50%;filter:saturate(1.35);box-shadow:inset 12px 12px 25px rgba(255,255,255,.12),inset -15px -15px 25px rgba(0,0,0,.08)}.blob1{width:270px;height:200px;left:-80px;top:25px;background:#7445ff;transform:rotate(-18deg) scale(0);animation:blobPop 1s .85s cubic-bezier(.16,1,.3,1) forwards}.blob2{width:310px;height:145px;left:130px;top:75px;background:#5d91ff;transform:rotate(12deg) scale(0);animation:blobPop 1s 1.15s cubic-bezier(.16,1,.3,1) forwards}.blob3{width:235px;height:195px;right:-55px;top:10px;background:#d38aff;transform:rotate(-20deg) scale(0);animation:blobPop 1s 1.4s cubic-bezier(.16,1,.3,1) forwards}.blob4{width:285px;height:125px;left:205px;bottom:15px;background:#7445ff;transform:rotate(-8deg) scale(0);animation:blobPop 1s 1.65s cubic-bezier(.16,1,.3,1) forwards}.paint-brush{position:absolute;z-index:5;left:67%;top:17%;width:210px;height:52px;transform:rotate(-38deg) translate(180px,-100px);transform-origin:right center;animation:brushMove 2.25s .55s cubic-bezier(.16,1,.3,1) forwards;filter:drop-shadow(8px 12px 8px rgba(0,0,0,.55))}.brush-handle{position:absolute;right:0;top:12px;width:150px;height:28px;border-radius:15px 7px 7px 15px;background:linear-gradient(90deg,#24150c,#8c5427,#d5a05b,#7c471f);border:2px solid #1c1009}.brush-metal{position:absolute;left:38px;top:7px;width:40px;height:38px;border-radius:4px;background:linear-gradient(90deg,#858a94,#fff,#b0b5bd,#656a73);border:2px solid #555}.bristles{position:absolute;left:0;top:5px;width:52px;height:42px;background:linear-gradient(135deg,#111 0%,#3d2b20 40%,#7445ff 70%);clip-path:polygon(0 15%,100% 0,88% 100%,0 78%);border-radius:3px}.paint-drip{position:absolute;z-index:6;width:15px;border-radius:0 0 12px 12px;background:#7445ff;opacity:0;transform-origin:top;animation:drip .8s 2.95s cubic-bezier(.2,.8,.2,1) forwards}.d1{left:35%;top:56%;height:80px}.d2{left:48%;top:58%;height:55px;background:#5d91ff;animation-delay:3.05s}.d3{left:62%;top:52%;height:95px;background:#d38aff;animation-delay:3.15s}.paint-copy{position:absolute;bottom:1%;color:#fff;font:700 .68rem/1 Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;opacity:0;transform:translateY(12px);animation:copyIn .7s 3.25s cubic-bezier(.16,1,.3,1) forwards}.paint-copy:before{content:"";display:inline-block;width:28px;height:1px;background:rgba(255,255,255,.65);vertical-align:middle;margin:0 12px 3px 0}
@keyframes canvasIn{0%{opacity:0;transform:rotate(-10deg) scale(.35)}70%{opacity:1;transform:rotate(-1deg) scale(.9)}100%{opacity:1;transform:rotate(-3deg) scale(.78)}}@keyframes blobPop{0%{opacity:0;transform:rotate(20deg) scale(0) translate(-40px,20px)}65%{opacity:1;transform:rotate(-4deg) scale(1.08)}100%{opacity:1;transform:rotate(0) scale(1)}}@keyframes brushMove{0%{transform:rotate(-38deg) translate(180px,-100px)}24%{transform:rotate(-42deg) translate(35px,15px)}48%{transform:rotate(-30deg) translate(-190px,115px)}68%{transform:rotate(-40deg) translate(25px,0)}84%{transform:rotate(-32deg) translate(-100px,55px)}100%{transform:rotate(-38deg) translate(180px,-100px)}}@keyframes drip{0%{opacity:0;transform:scaleY(.1)}100%{opacity:1;transform:scaleY(1)}}@keyframes copyIn{to{opacity:1;transform:translateY(0)}}@keyframes shine{to{transform:translateX(120%)}}@keyframes aurora{0%,100%{transform:scale(.8);opacity:.35}50%{transform:scale(1.15);opacity:.7}}@keyframes paintIntroOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.paint-intro{animation:none;display:none}}
</style></head>
<body>
<div class="paint-intro" aria-hidden="true"><div class="paint-stage"><div class="real-canvas"></div><div class="paint-surface"><div class="paint-blob blob1"></div><div class="paint-blob blob2"></div><div class="paint-blob blob3"></div><div class="paint-blob blob4"></div></div><div class="paint-brush"><div class="bristles"></div><div class="brush-metal"></div><div class="brush-handle"></div></div><div class="paint-drip d1"></div><div class="paint-drip d2"></div><div class="paint-drip d3"></div><div class="paint-copy">Paint your vision</div></div></div>
<div class="container"><header class="topbar"><a class="brand" href="index.html">AURIX</a><span class="progress">Step 1 of 1</span></header><main><h1>Tell us about your project</h1><p class="subtitle">Help us understand your vision so we can create the perfect website for you</p><form id="briefForm"><div class="form-group"><label for="name">Your Name *</label><input type="text" id="name" name="name" required></div><div class="form-group"><label for="email">Email *</label><input type="email" id="email" name="email" required></div><div class="form-group"><label for="phone">Phone Number *</label><input type="tel" id="phone" name="phone" required></div><div class="form-group"><label for="businessName">Business Name *</label><input type="text" id="businessName" name="businessName" required></div><div class="form-group"><label for="businessDescription">Business Description</label><textarea id="businessDescription" name="businessDescription"></textarea></div><div class="form-group"><label for="goal">What should visitors do on your website?</label><textarea id="goal" name="goal" placeholder="e.g., Buy products, book appointments, contact for inquiries..."></textarea></div><div class="form-group"><label>Which pages do you need?</label><div class="checkbox-group"><div class="checkbox-item"><input type="checkbox" id="home" name="features" value="Home"><label for="home">Home</label></div><div class="checkbox-item"><input type="checkbox" id="about" name="features" value="About"><label for="about">About</label></div><div class="checkbox-item"><input type="checkbox" id="services" name="features" value="Services"><label for="services">Services</label></div><div class="checkbox-item"><input type="checkbox" id="portfolio" name="features" value="Portfolio"><label for="portfolio">Portfolio</label></div><div class="checkbox-item"><input type="checkbox" id="contact" name="features" value="Contact"><label for="contact">Contact</label></div><div class="checkbox-item"><input type="checkbox" id="blog" name="features" value="Blog"><label for="blog">Blog</label></div></div></div><div class="form-group"><label for="style">What should the website feel like?</label><select id="style" name="style"><option value="">Select a style...</option><option value="modern">Modern & Minimalist</option><option value="bold">Bold & Colorful</option><option value="professional">Professional & Corporate</option><option value="creative">Creative & Artistic</option><option value="playful">Playful & Fun</option></select></div><div class="form-group"><label for="colors">Choose your font/color style</label><select id="colors" name="colors"><option value="">Select a style...</option><option value="dark">Dark & Elegant</option><option value="light">Light & Bright</option><option value="pastel">Pastel & Soft</option><option value="vibrant">Vibrant & Bold</option><option value="neutral">Neutral & Timeless</option></select></div><div class="form-group"><label for="hasContent">Do you already have website content?</label><select id="hasContent" name="hasContent"><option value="">Select...</option><option value="yes">Yes, I'll provide it</option><option value="no">No, I need help creating it</option><option value="partial">I have some, need help with the rest</option></select></div><div class="form-group"><label for="timeline">Project Timeline</label><select id="timeline" name="timeline"><option value="">Select...</option><option value="asap">ASAP</option><option value="2weeks">Within 2 weeks</option><option value="1month">Within 1 month</option><option value="flexible">Flexible</option></select></div><div class="form-group"><label for="additionalInfo">Anything else you'd like to tell us?</label><textarea id="additionalInfo" name="additionalInfo" placeholder="Share any additional details..."></textarea></div><div class="button-group"><button type="submit" class="submit-button">Submit Brief</button><button type="reset" class="reset-button">Clear Form</button></div><div id="saveStatus" class="status-message"></div></form></main></div>
<script>const form=document.getElementById('briefForm');form.addEventListener('submit',async(e)=>{e.preventDefault();const btn=form.querySelector('.submit-button'),status=document.getElementById('saveStatus');btn.disabled=true;status.className='status-message loading';status.textContent='Submitting your brief...';const f=new FormData(form),data={name:f.get('name'),email:f.get('email'),phone:f.get('phone'),businessName:f.get('businessName'),businessDescription:f.get('businessDescription'),goal:f.get('goal'),style:f.get('style'),colors:f.get('colors'),hasContent:f.get('hasContent'),additionalInfo:f.get('additionalInfo'),timeline:f.get('timeline'),features:f.getAll('features')};try{const r=await fetch('/api/submit-brief',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),result=await r.json();if(r.ok){status.className='status-message success';status.textContent='✓ Brief submitted successfully! We\'ll be in touch soon.';form.reset()}else{status.className='status-message error';status.textContent=`Error: ${result.error||'Failed to submit'}`}}catch(error){status.className='status-message error';status.textContent=`Error: ${error.message}`}finally{btn.disabled=false}});</script>
</body></html>
