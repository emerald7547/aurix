<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX | Project Brief</title><link rel="stylesheet" href="style.css"></head><body><main><form id="briefForm"><input name="name" required placeholder="Your name"><input name="project" required placeholder="Business / project name"><input name="contact" required placeholder="Email or phone"><textarea name="description" placeholder="Tell us about your project"></textarea><input name="website-type" value="Business" placeholder="Website type"><input name="primary" type="color" value="#7445ff"><input name="secondary" type="color" value="#5d91ff"><input name="accent" type="color" value="#d38aff"><input name="timeline" placeholder="Timeline"><input name="content" placeholder="Content available"><textarea name="additional" placeholder="Additional information"></textarea><div><label>Pages</label><label><input name="pages" type="checkbox" value="Home"> Home</label><label><input name="pages" type="checkbox" value="About"> About</label><label><input name="pages" type="checkbox" value="Services"> Services</label><label><input name="pages" type="checkbox" value="Products"> Products</label><label><input name="pages" type="checkbox" value="Portfolio"> Portfolio</label><label><input name="pages" type="checkbox" value="Blog"> Blog</label><label><input name="pages" type="checkbox" value="Contact"> Contact</label></div><div><label>Reference photos</label><input id="aurixPhotos" type="file" accept="image/*" multiple></div><button class="submit-button" type="submit">Submit brief</button></form><div class="success"><h2>Thank you.</h2><p>Your brief has been received.</p></div></main><script>
(function(){const form=document.getElementById('briefForm');form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('.submit-button');btn.disabled=true;btn.textContent='Saving…';const fd=new FormData(form);const files=[...document.getElementById('aurixPhotos').files];try{const photos=[];for(const file of files){if(file.size>10*1024*1024)throw Error('Each photo must be 10MB or less');const x=new FormData();x.append('file',file);const r=await fetch('/api/upload-photo',{method:'POST',body:x});const d=await r.json();if(!r.ok)throw Error(d.error||'Photo upload failed');photos.push(d)}const contact=String(fd.get('contact')||'').trim();const email=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)?contact:'';const phone=email?'':contact;const payload={name:fd.get('name'),email,phone,businessName:fd.get('project'),businessDescription:fd.get('description'),goal:fd.get('website-type'),style:'',colors:[fd.get('primary'),fd.get('secondary'),fd.get('accent')].join(', '),hasContent:fd.get('content'),additionalInfo:fd.get('additional'),timeline:fd.get('timeline'),features:[...form.querySelectorAll('input[name="pages"]:checked')].map(x=>x.value),photos};const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');form.style.display='none';document.querySelector('.success').classList.add('is-visible')}catch(err){console.error(err);alert(err.message);btn.disabled=false;btn.textContent='Submit brief'}})})();
</script></body></html>
