<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX | Client Portal</title><style>body{margin:0;background:#080a12;color:#f5f4f1;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(760px,100%);background:#11131a;border:1px solid #292d38;border-radius:18px;padding:28px}.tabs{display:flex;gap:8px;margin-bottom:24px}.tabs button{padding:10px 18px;background:#171a22;color:#fff;border:1px solid #333;border-radius:8px;cursor:pointer}.tabs .on{background:#7445ff}.field{margin:12px 0}.field input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#080a12;color:#fff;box-sizing:border-box}.action{margin-top:14px;padding:12px 20px;border:0;border-radius:8px;background:#7445ff;color:#fff;font-weight:700;cursor:pointer}.error{color:#ff7888}.project{border:1px solid #292d38;border-radius:14px;padding:20px;margin-top:18px;background:#171a22}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.step{padding:12px 5px;border-radius:8px;background:#0c0e14;color:#777;text-align:center;font-size:12px}.step.active{background:#7445ff;color:#fff}.step.done{background:#244d35;color:#9cffb2}.muted{color:#999}</style></head><body><div class="box"><h1>AURIX Client Portal</h1><p class="muted">Log in anytime to check your website progress.</p><div id="auth"><div class="tabs"><button id="loginTab" class="on" onclick="mode('login')">Log in</button><button id="signupTab" onclick="mode('signup')">Create account</button></div><div class="field"><input id="email" type="email" placeholder="Your email"></div><div class="field"><input id="password" type="password" placeholder="Password"></div><button class="action" onclick="auth()" id="authBtn">Log in</button><p id="msg"></p></div><div id="portal" style="display:none"><p id="accountEmail" class="muted"></p><div id="projects"></div></div></div><script>let action='login';function mode(x){action=x;loginTab.classList.toggle('on',x==='login');signupTab.classList.toggle('on',x==='signup');authBtn.textContent=x==='login'?'Log in':'Create account';msg.textContent=''}async function auth(){msg.textContent='';const r=await fetch('/api/client-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,email:email.value,password:password.value})});const d=await r.json();if(!r.ok){msg.className='error';msg.textContent=d.error;return}showPortal()}async function showPortal(){auth.style.display='none';portal.style.display='block';const r=await fetch('/api/client-status');if(!r.ok){auth.style.display='block';portal.style.display='none';msg.textContent='Please log in again.';return}const d=await r.json();accountEmail.textContent='Logged in as '+d.email;projects.innerHTML=d.submissions.length?d.submissions.map(render).join(''):'<p class="muted">No projects yet. Your submitted projects will appear here.</p>'}function render(s){const order=['pending','approved','building','deploying','complete'];const i=order.indexOf(s.status);return `<div class="project"><h2>${safe(s.business_name)}</h2><p class="muted">${safe(s.status_message||'Your submission is received and awaiting review.')}</p><div class="steps">${[['pending','Received'],['approved','Approved'],['building','Building'],['deploying','Deploying'],['complete','Complete']].map((x,n)=>`<div class="step ${n<=i?'done':''} ${x[0]===s.status?'active':''}">${x[1]}</div>`).join('')}</div></div>`}function safe(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}showPortal()</script></body></html>
