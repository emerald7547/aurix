<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURIX | Your Project</title><style>:root{--ink:#080a12;--paper:#f5f4f1;--violet:#7445ff;--blue:#5d91ff;--pink:#d38aff;--muted:#686975}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}.nav{padding:24px 5vw;border-bottom:1px solid #d8d6d0;display:flex;justify-content:space-between}.brand{font-size:24px;letter-spacing:.08em;text-decoration:none;color:var(--ink)}.nav button{border:0;background:none;font:700 .68rem Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}.hero{padding:clamp(4rem,9vw,8rem) 5vw 5rem;background:#090b13;color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:600px;height:600px;right:-180px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(116,69,255,.5),transparent 68%);filter:blur(20px)}.hero>*{position:relative;z-index:1}.eyebrow{color:var(--pink);font:700 .7rem Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase}.hero h1{font-size:clamp(3.5rem,9vw,8rem);font-weight:400;line-height:.85;margin:1rem 0}.hero p{color:#d7d5df;font:1rem/1.7 Arial,sans-serif;max-width:38rem}.content{max-width:1100px;margin:auto;padding:clamp(3rem,7vw,6rem) 5vw}.project{display:grid;grid-template-columns:.8fr 1.2fr;gap:5vw;align-items:start}.label{color:#777;font:700 .65rem Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.project h2{font-size:clamp(2rem,5vw,4rem);font-weight:400;margin:.6rem 0}.message{font:1rem/1.7 Arial,sans-serif;color:#555}.timeline{position:relative;padding-left:35px}.timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:#c8c6c2}.stage{position:relative;padding:0 0 38px}.dot{position:absolute;left:-34px;top:3px;width:14px;height:14px;border:2px solid #aaa;border-radius:50%;background:var(--paper)}.stage.done .dot{border-color:var(--violet);background:var(--violet);box-shadow:0 0 0 5px rgba(116,69,255,.1)}.stage.current .dot{border-color:var(--pink);background:var(--pink);box-shadow:0 0 0 7px rgba(211,138,255,.14)}.stage h3{font-size:1.3rem;font-weight:400;margin:0 0 .4rem}.stage p{font: .85rem/1.5 Arial,sans-serif;color:var(--muted);margin:0}.meta{border-top:1px solid #c8c6c2;margin-top:1rem;padding-top:1rem;font: .75rem Arial,sans-serif;color:#777}.note{margin-top:3rem;padding:1.5rem;border-left:2px solid var(--violet);background:#eeece8;font: .85rem/1.6 Arial,sans-serif}.loading{padding:5rem;text-align:center;font:1rem Arial,sans-serif;color:#777}@media(max-width:750px){.project{grid-template-columns:1fr;gap:3rem}}</style></head><body><nav class="nav"><a class="brand" href="index.html">AURIX</a><button onclick="logout()">Log out</button></nav><section class="hero"><div class="eyebrow">Your AURIX project</div><h1>From idea<br>to impact.</h1><p id="email">Loading your studio account…</p></section><main class="content"><div id="projects" class="loading">Loading your project…</div></main><script>const order=['pending','approved','building','deploying','complete'];const names=[['pending','Received','Your brief is safely with us.'],['approved','Approved','Your project has been reviewed and approved.'],['building','Building','Your website is being designed and built.'],['deploying','Deploying','Your finished website is being prepared for launch.'],['complete','Complete','Your website is live and ready.']];async function load(){const r=await fetch('/api/client-status');if(r.status===401){location.href='login.html';return}const d=await r.json();document.getElementById('email').textContent='Signed in as '+d.email;const el=document.getElementById('projects');if(!d.submissions.length){el.innerHTML='<div class="project"><div><div class="label">No project yet</div><h2>Your brief is next.</h2><p class="message">Once you submit your project brief, its progress will appear here.</p></div></div>';return}el.className='';el.innerHTML=d.submissions.map(s=>{const idx=order.indexOf(s.status||'pending');return `<article class="project"><div><div class="label">Current project</div><h2>${safe(s.business_name)}</h2><p class="message">${safe(s.status_message||'Your submission is received and awaiting review.')}</p><div class="meta">Submitted ${new Date(s.submitted_at).toLocaleDateString()}</div><div class="note">AURIX typically delivers websites within <b>2–3 days</b>. If your project needs more time, we'll keep this page updated.</div></div><div class="timeline">${names.map((n,i)=>`<div class="stage ${i<=idx?'done':''} ${i===idx?'current':''}"><span class="dot"></span><h3>${n[1]}</h3><p>${i===idx?s.status_message:n[2]}</p></div>`).join('')}</div></article>`}).join('')}function safe(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function logout(){document.cookie='aurix_session=; Max-Age=0; Path=/';location.href='login.html'}load();setInterval(load,15000)</script></body></html>
